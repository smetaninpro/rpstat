services:
  backend:
    ports: []

  frontend:
    ports: []

  caddy:
    image: caddy:2-alpine
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
